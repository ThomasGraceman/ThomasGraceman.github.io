<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="500" height="300" fill="url(#bg)"/>
  <rect width="500" height="300" fill="url(#dots)"/>
  <rect width="500" height="300" fill="url(#glow)"/>
  <text x="250" y="195" font-size="120" text-anchor="middle">🌳</text>
  <text x="250" y="262" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">Probabilistic Tree Embeddings</text>
</svg>
